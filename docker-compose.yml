# Local Postgres for macOS/Linux with Docker:  docker compose up -d
# Same URL as scripts/local_pg.sh:  postgresql://pnd:pnd@localhost:54329/pnd
services:
  postgres:
    image: postgres:16
    container_name: pnd-postgres
    environment:
      POSTGRES_USER: pnd
      POSTGRES_PASSWORD: pnd
      POSTGRES_DB: pnd
    ports:
      - "54329:5432"
    command: ["postgres", "-c", "fsync=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnd -d pnd"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
