AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ไปไหนดีวะ (Pai-nhai-dee-wa) LINE group bot - pilot stack

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  MonthlyBudgetUsd:
    Type: Number
    Default: 28
    Description: Monthly AWS budget alarm in USD (1,000 THB is about USD 28)
  AlertEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: must be a valid email address
    Description: Email that receives budget and DLQ alarms (SNS sends a confirmation mail - click it!)
  LlmProvider:
    Type: String
    Default: gemini
    AllowedValues: [fake, gemini]
  PlacesProvider:
    Type: String
    Default: google
    AllowedValues: [fake, google]
  GeminiPaidTierConfirmed:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Must be "true" (Gemini paid tier) or the bot will not read group chat
  BotEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Kill switch
  MaxPlacesCallsPerDay:
    Type: Number
    Default: 300
  WebhookReservedConcurrency:
    Type: Number
    Default: 10
    Description: Caps webhook parallelism (cost/abuse guard). -1 = no reservation. New AWS accounts with a total limit of 10 must use -1 (see docs/DEPLOY.md)
  WorkerReservedConcurrency:
    Type: Number
    Default: 5
    Description: Caps worker parallelism (limits Gemini/Places spend). -1 = no reservation (see docs/DEPLOY.md)

Conditions:
  ReserveWebhook: !Not [!Equals [!Ref WebhookReservedConcurrency, -1]]
  ReserveWorker: !Not [!Equals [!Ref WorkerReservedConcurrency, -1]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    LoggingConfig:
      LogFormat: Text
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_NAME: !Ref Table
        STORE_PROVIDER: dynamo
        LINE_PROVIDER: real
        LLM_PROVIDER: !Ref LlmProvider
        PLACES_PROVIDER: !Ref PlacesProvider
        GEMINI_PAID_TIER_CONFIRMED: !Ref GeminiPaidTierConfirmed
        BOT_ENABLED: !Ref BotEnabled
        MAX_PLACES_CALLS_PER_DAY: !Ref MaxPlacesCallsPerDay
        LINE_CHANNEL_SECRET_PARAM: !Sub /pai-nhai-dee-wa/${Stage}/line-channel-secret
        LINE_CHANNEL_ACCESS_TOKEN_PARAM: !Sub /pai-nhai-dee-wa/${Stage}/line-channel-access-token
        GEMINI_API_KEY_PARAM: !Sub /pai-nhai-dee-wa/${Stage}/gemini-api-key
        GOOGLE_PLACES_API_KEY_PARAM: !Sub /pai-nhai-dee-wa/${Stage}/google-places-api-key

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pai-nhai-dee-wa-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }  # sessions/counters expire by themselves (PDPA: no long-term storage)

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 1209600  # 14 days: time to inspect failed events
      SqsManagedSseEnabled: true

  EventQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true  # one ordered stream per LINE group (MessageGroupId = groupId)
      VisibilityTimeout: 180  # >= 6x worker timeout
      MessageRetentionPeriod: 3600  # LINE reply tokens are short-lived; stale events are useless
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handlers.webhook.handler
      Timeout: 5
      ReservedConcurrentExecutions: !If [ReserveWebhook, !Ref WebhookReservedConcurrency, !Ref AWS::NoValue]
      Environment:
        Variables:
          QUEUE_URL: !Ref EventQueue
      FunctionUrlConfig:
        AuthType: NONE  # LINE signature is verified in code
      Policies:
        - SQSSendMessagePolicy: { QueueName: !GetAtt EventQueue.QueueName }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pai-nhai-dee-wa/${Stage}/line-channel-secret  # webhook needs only the signature secret

  WebhookLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WebhookFunction}
      RetentionInDays: 7

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handlers.worker.handler
      Timeout: 30
      ReservedConcurrentExecutions: !If [ReserveWorker, !Ref WorkerReservedConcurrency, !Ref AWS::NoValue]
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pai-nhai-dee-wa/${Stage}/line-channel-access-token
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pai-nhai-dee-wa/${Stage}/gemini-api-key
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pai-nhai-dee-wa/${Stage}/google-places-api-key
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt EventQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WorkerFunction}
      RetentionInDays: 7

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - { Protocol: email, Endpoint: !Ref AlertEmail }

  DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Events failed 3 times and landed in the DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt DeadLetterQueue.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]

  WorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Worker Lambda raised errors (check CloudWatch Logs, no chat text is logged)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref WorkerFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  WebhookTrafficAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Unusual webhook traffic (more than 3,000 calls/hour) - possible abuse or loop; consider BotEnabled=false
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - { Name: FunctionName, Value: !Ref WebhookFunction }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub pai-nhai-dee-wa-${Stage}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  WebhookUrl:
    Description: Use this URL as the LINE webhook URL (any path works)
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref Table
