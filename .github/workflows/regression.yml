# Nightly regression: heavier than the PR pipeline. Also runnable by hand (Actions > regression > Run).
# On failure it opens (or comments on) one issue labelled `nightly-regression`.
name: regression

on:
  schedule:
    - cron: "0 19 * * *"   # 02:00 Asia/Bangkok
  workflow_dispatch:
    inputs:
      eval_min_intent_accuracy:
        description: "Minimum intent accuracy (percent) for the offline rules eval"
        required: false
        default: "90"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  full-suite-postgres:
    name: full suite x Postgres 16
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pnd
          POSTGRES_PASSWORD: pnd
          POSTGRES_DB: pnd
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U pnd -d pnd"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      STORE: postgres
      DATABASE_URL: postgresql://pnd:pnd@localhost:54329/pnd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --cov --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-suite-postgres
          path: |
            coverage.xml
            junit.xml
          retention-days: 30

  sandbox-determinism:
    name: sandbox determinism (5 hash seeds x 5 in-run repeats)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hashseed: ["0", "1", "2", "3", "4"]   # different str-hash orderings catch set/dict-order bugs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: make sandbox
        env:
          PYTHONHASHSEED: ${{ matrix.hashseed }}
        run: make sandbox
      - run: cp reports/sandbox_report.md "sandbox_report_seed${{ matrix.hashseed }}.md"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sandbox-report-seed${{ matrix.hashseed }}
          path: sandbox_report_seed${{ matrix.hashseed }}.md
          retention-days: 30

  intent-eval:
    name: intent eval (offline rules, labelled Thai utterances)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: python -m scripts.eval_intents (scripts/eval_intents.py always exits 0, so the threshold is checked here)
        env:
          MIN: ${{ inputs.eval_min_intent_accuracy || '90' }}
        run: |
          python -m scripts.eval_intents --places | tee eval_report.txt
          pct=$(grep -oE 'intent accuracy : [0-9]+/[0-9]+ = [0-9]+%' eval_report.txt | grep -oE '[0-9]+%' | tr -d '%')
          if [ -z "$pct" ]; then echo "::error::could not parse eval output"; exit 1; fi
          echo "intent accuracy ${pct}% (min ${MIN}%)"
          if [ "$pct" -lt "$MIN" ]; then echo "::error::intent accuracy ${pct}% < ${MIN}%"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intent-eval
          path: eval_report.txt
          retention-days: 30

  report-failure:
    name: open / refresh failure issue
    needs: [full-suite-postgres, sandbox-determinism, intent-eval]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Create or update the nightly-regression issue
        run: |
          gh label create nightly-regression --color B60205 --description "Nightly regression failed" 2>/dev/null || true
          summary=$(printf '%s' "$RESULTS" | jq -r 'to_entries[] | "- \(.key): \(.value.result)"')
          body=$(printf 'Nightly regression failed.\n\nRun: %s\n\n%s\n\nArtifacts (reports, coverage, sandbox_report) are attached to the run. See docs/TEST_STRATEGY.md for triage rules.' "$RUN_URL" "$summary")
          existing=$(gh issue list --label nightly-regression --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Nightly regression failing" --label nightly-regression --body "$body"
          fi
